<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Li Kui | Engineering meets connected knowledge</title>
  <desc id="desc">Animated neon circuit paths and knowledge nodes over a deep navy and violet background.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b18"/><stop offset=".5" stop-color="#171333"/><stop offset="1" stop-color="#062a37"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/><stop offset=".48" stop-color="#67e8f9"/><stop offset="1" stop-color="#86efac"/>
    </linearGradient>
    <radialGradient id="orb"><stop stop-color="#67e8f9" stop-opacity=".28"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#94a3b8" stroke-opacity=".10"/></pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="4"/></filter>
    <clipPath id="clip"><rect width="1200" height="320" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1200" height="320" fill="url(#bg)"/><rect width="1200" height="320" fill="url(#grid)"/>
    <circle cx="950" cy="130" r="260" fill="url(#orb)"/>
    <g fill="none" stroke="url(#beam)" stroke-width="1.5" opacity=".55">
      <path d="M690 55H800L835 90H920L955 55H1140"><animate attributeName="stroke-dasharray" values="2 18;18 2;2 18" dur="8s" repeatCount="indefinite"/></path>
      <path d="M760 112H830L865 147H1020L1055 112H1170"><animate attributeName="stroke-dasharray" values="18 4;4 18;18 4" dur="7s" repeatCount="indefinite"/></path>
      <path d="M700 220H820L855 185H930L965 220H1140"><animate attributeName="stroke-dasharray" values="2 14;14 2;2 14" dur="6s" repeatCount="indefinite"/></path>
      <path d="M860 275H940L975 240H1130"/>
      <path d="M1080 35V76L1105 101V165L1075 195V250"/>
    </g>
    <g fill="#67e8f9">
      <circle cx="800" cy="55" r="4"><animate attributeName="r" values="3;7;3" dur="2.8s" repeatCount="indefinite"/></circle>
      <circle cx="920" cy="90" r="4"><animate attributeName="r" values="4;8;4" dur="3.2s" repeatCount="indefinite"/></circle>
      <circle cx="1020" cy="147" r="4"><animate attributeName="r" values="3;7;3" dur="2.4s" repeatCount="indefinite"/></circle>
      <circle cx="930" cy="185" r="4"><animate attributeName="r" values="4;8;4" dur="3s" repeatCount="indefinite"/></circle>
    </g>
    <g fill="#a78bfa"><circle cx="955" cy="55" r="3"/><circle cx="1055" cy="112" r="3"/><circle cx="965" cy="220" r="3"/></g>
    <path d="M680 0V320" stroke="#a78bfa" stroke-opacity=".28"/>
    <g font-family="Inter,Segoe UI,Arial,sans-serif">
      <text x="64" y="64" fill="#c4b5fd" font-size="14" font-weight="600" letter-spacing="4">ENGINEER / BUILDER / LIFELONG LEARNER</text>
      <text x="60" y="146" fill="#fff" font-size="68" font-weight="800" letter-spacing="-2">LI KUI</text>
      <rect x="64" y="169" width="112" height="4" rx="2" fill="url(#beam)"><animate attributeName="width" values="72;150;112" dur="5s" repeatCount="indefinite"/></rect>
      <text x="64" y="213" fill="#e5e7eb" font-size="24" font-weight="550">Build small. Think deeply. Connect ideas.</text>
      <text x="64" y="253" fill="#a5b4fc" font-size="14" letter-spacing="1.4">AUTOMOTIVE SOFTWARE  /  EMBEDDED SYSTEMS</text>
      <text x="64" y="276" fill="#67e8f9" font-size="14" letter-spacing="1.4">KNOWLEDGE ENGINEERING  /  OPEN SOURCE</text>
    </g>
    <g font-family="monospace" font-size="10" fill="#a5f3fc" opacity=".62">
      <text x="860" y="30">01 / CONNECT</text><text x="1015" y="292">02 / BUILD</text><text x="1080" y="183">03 / LEARN</text>
    </g>
  </g>
</svg>