<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Li Kui — Build, Connect, Create</title>
  <desc id="desc">A dark, futuristic profile banner about embedded systems, automotive software, and connected knowledge.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#171335"/>
      <stop offset="1" stop-color="#082b3b"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="0.52" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#86efac"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#9ca3af" stroke-opacity=".12" stroke-width="1"/>
    </pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="24"/></filter>
  </defs>
  <rect width="1200" height="300" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="22" fill="url(#grid)"/>
  <circle cx="980" cy="60" r="120" fill="#7c3aed" opacity=".26" filter="url(#blur)"/>
  <circle cx="1080" cy="260" r="130" fill="#06b6d4" opacity=".20" filter="url(#blur)"/>
  <g fill="none" stroke="url(#glow)" stroke-width="1.6" opacity=".7">
    <path d="M740 70h110l24 24h86l30-30h140"/>
    <path d="M780 110h68l28 28h115l22-22h112"/>
    <path d="M760 224h130l30-30h74l22 22h100"/>
    <path d="M900 270h70l22-22h120"/>
    <circle cx="740" cy="70" r="4" fill="#a78bfa"/><circle cx="1130" cy="64" r="4" fill="#86efac"/>
    <circle cx="780" cy="110" r="4" fill="#67e8f9"/><circle cx="1125" cy="116" r="4" fill="#a78bfa"/>
    <circle cx="760" cy="224" r="4" fill="#86efac"/><circle cx="1112" cy="270" r="4" fill="#67e8f9"/>
  </g>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="68" y="70" fill="#c4b5fd" font-size="15" letter-spacing="4">ENGINEER · BUILDER · LIFELONG LEARNER</text>
    <text x="64" y="145" fill="#ffffff" font-size="62" font-weight="750" letter-spacing="-2">LI KUI</text>
    <rect x="68" y="169" width="82" height="4" rx="2" fill="url(#glow)"/>
    <text x="68" y="211" fill="#e5e7eb" font-size="23" font-weight="550">Build small. Think deeply. Connect ideas.</text>
    <text x="68" y="248" fill="#a5b4fc" font-size="15" letter-spacing="1.2">AUTOMOTIVE SOFTWARE  /  EMBEDDED SYSTEMS  /  KNOWLEDGE ENGINEERING</text>
  </g>
</svg>