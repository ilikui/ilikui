<svg xmlns="http://www.w3.org/2000/svg" width="920" height="285" viewBox="0 0 920 285" role="img" aria-labelledby="title desc">
<title id="title">GitHub public activity graph for ilikui</title>
<desc id="desc">The first scheduled GitHub Actions run will generate the activity graph from public GitHub events.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#111827"/></linearGradient></defs>
<rect width="920" height="285" rx="18" fill="url(#bg)"/>
<text x="34" y="38" fill="#f8fafc" font-size="18" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="700">PUBLIC ACTIVITY</text>
<text x="34" y="59" fill="#94a3b8" font-size="11" font-family="Inter,Segoe UI,Arial,sans-serif">@ilikui · self-hosted SVG</text>
<g stroke="#273449" stroke-width="1"><line x1="62" y1="100" x2="868" y2="100"/><line x1="62" y1="150" x2="868" y2="150"/><line x1="62" y1="200" x2="868" y2="200"/></g>
<rect x="62" y="82" width="806" height="130" rx="8" fill="none" stroke="#334155" stroke-dasharray="5 6"/>
<line x1="62" y1="200" x2="868" y2="200" stroke="#334155" stroke-width="2"/>
<text x="460" y="125" text-anchor="middle" fill="#67e8f9" font-size="16" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="600">Preparing your activity graph</text>
<text x="460" y="145" text-anchor="middle" fill="#94a3b8" font-size="12" font-family="Inter,Segoe UI,Arial,sans-serif">GitHub Actions will replace this preview with sampled public event data.</text>
<text x="34" y="255" fill="#64748b" font-size="10" font-family="Inter,Segoe UI,Arial,sans-serif">Public GitHub Events API · excludes private contributions · up to 300 recent events</text>
<text x="884" y="255" text-anchor="end" fill="#64748b" font-size="10" font-family="Inter,Segoe UI,Arial,sans-serif">Initial preview</text>
</svg>
