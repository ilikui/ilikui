# Generate the GitHub contribution snake and publish it to the output branch.
name: Generate Snake

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/Generate Snak.yml"
  schedule:
    # Run twice a day (UTC).
    - cron: "0 */12 * * *"

permissions:
  contents: write

jobs:
  snake-animation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate Snake Animation
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Snake Animation
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
